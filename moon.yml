$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it (core.25).
  format:
    command: 'treefmt --ci'
    inputs: ['/**/*']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy --workspace --all-targets --all-features -- -D warnings'
    inputs: ['/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc, cargo, clippy and rustfmt are the build .prototools pins, and
  # openspec and the Claude Code skills it writes the release devenv.nix
  # pins, on whichever host runs the gate (core.26; ADR 0030). It reads the
  # tools it checks from outside the tree, so it never replays.
  toolchain:
    command: 'sh check-toolchain.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # rustc compiles through the compile server the host's sluice settings
  # declare, in a run and in a session's shell alike, and unwrapped where
  # the host declares none (check-compile-server.sh). It reads the shell it
  # runs in and the host's settings, so it never replays.
  compile-server:
    command: 'sh check-compile-server.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # A merge made outside the shell, as a take is, passes the commit hooks
  # devenv.nix installs (check-hooks.sh). It installs the hooks the shell
  # it runs in builds, so it never replays.
  hooks:
    command: 'sh check-hooks.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # The Claude Code marketplace, which spans the plugins: it validates, and
  # every plugin it lists has a manifest. Each plugin's own checks are its
  # project's (plugins/*/moon.yml).
  marketplace:
    command: 'plugins/check-marketplace.sh'
    inputs: ['/.claude-plugin/**/*', '/plugins/*/.claude-plugin/**/*', '/plugins/check-marketplace.sh', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # No two decision records share a number (check-adrs.sh).
  adrs:
    command: 'sh check-adrs.sh'
    inputs: ['/docs/adr/*.md', '/check-adrs.sh']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every file that carries timber's version gives the workspace's, 0.0.0
  # on main, and the writer a release's commit runs, set-version.sh, run on
  # a scratch copy, writes a release's version into each and changes
  # nothing else (check-versions.sh; record 0031; core.74). jq is devenv's.
  versions:
    command: 'sh check-versions.sh'
    inputs: ['/Cargo.toml', '/Cargo.lock', '/plugins/claude-code/.claude-plugin/plugin.json', '/plugins/herdr/herdr-plugin.toml', '/set-version.sh', '/check-versions.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # A release's tag names the release commit release-commit.sh makes, one
  # id wherever it runs, proved in scratch repositories; and a build takes
  # timber's version from its tree alone (check-release.sh; record 0031;
  # core.74). git and jq are devenv's, and it needs no credential.
  release:
    command: 'sh check-release.sh'
    inputs: ['/set-version.sh', '/release-commit.sh', '/check-release.sh', '/Cargo.toml', '/Cargo.lock', '/plugins/claude-code/.claude-plugin/plugin.json', '/plugins/herdr/herdr-plugin.toml', '/.github/workflows/ci.yml', '/flake.nix', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
